name: Coverage

on:
  schedule:
  - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_IMAGE: webguard-ci-coverage:${{ github.run_id }}
  PHP_OPCACHE_ENABLE: "1"
  PHP_MEMORY_LIMIT: "2048M"
  PHP_MAX_EXECUTION_TIME: "300"

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Record job start
      run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ci
        tags: ${{ env.CI_IMAGE }}
        load: true
        cache-from: type=gha,scope=coverage
        cache-to: type=gha,mode=max,scope=coverage

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/composer/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install PHP dependencies
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -v "$HOME/.cache/composer/files:/tmp/composer-cache" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Run full Pest suite with coverage
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
        XDEBUG_MODE: coverage
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e DB_CONNECTION -e DB_DATABASE -e XDEBUG_MODE \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer test:coverage -- --parallel --coverage-clover=coverage.xml

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ github.run_id }}
        path: coverage.xml
        if-no-files-found: warn
        retention-days: 14

    - name: Summarize job duration
      if: always()
      run: |
        duration="$(( $(date +%s) - JOB_STARTED_AT ))"
        {
          echo "## Coverage"
          echo
          echo "Completed in ${duration}s with Xdebug coverage instrumentation."
        } >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_IMAGE: webguard-ci:${{ github.run_id }}
  PHP_OPCACHE_ENABLE: "1"
  PHP_MEMORY_LIMIT: "2048M"
  PHP_MAX_EXECUTION_TIME: "300"

jobs:
  changes:
    name: Topology scope
    runs-on: ubuntu-latest
    outputs:
      topology: ${{ steps.scope.outputs.topology }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Determine topology smoke scope
      id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "topology=true" >> "$GITHUB_OUTPUT"
          echo "reason=non-pull-request-run" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        topology="$(.github/scripts/should-run-topology-smoke.sh "$BASE_SHA" "$HEAD_SHA")"
        echo "topology=$topology" >> "$GITHUB_OUTPUT"

        if [ "$topology" = "true" ]; then
          echo "reason=runtime-or-infrastructure-change" >> "$GITHUB_OUTPUT"
        else
          echo "reason=docs-tests-or-isolated-domain-change" >> "$GITHUB_OUTPUT"
        fi

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
    - name: Record job start
      run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ci
        tags: ${{ env.CI_IMAGE }}
        load: true
        cache-from: type=gha,scope=quality
        cache-to: type=gha,mode=max,scope=quality

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/composer/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install PHP dependencies
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -v "$HOME/.cache/composer/files:/tmp/composer-cache" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          node_modules
          frontend/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install Bun workspace dependencies
      run: bun install --frozen-lockfile

    - name: Check Rector formatting
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          ./vendor/bin/rector process --dry-run --ansi

    - name: Check Pint formatting
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          ./vendor/bin/pint --test --parallel

    - name: Build frontend assets
      run: |
        bun run frontend:check
        bun run frontend:build
        bun run --cwd frontend budget

    - name: Run PHPStan
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer analyse

    - name: Verify external OpenAPI contract is current
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e DB_CONNECTION -e DB_DATABASE \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          php artisan scribe:generate --no-interaction
        git diff --exit-code -- storage/app/private/scribe/openapi.yaml

    - name: Summarize job duration
      if: always()
      run: |
        duration="$(( $(date +%s) - JOB_STARTED_AT ))"
        {
          echo "## Quality"
          echo
          echo "Completed in ${duration}s. Rector and Pint ran in check-only mode."
        } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Record job start
      run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        target: ci
        tags: ${{ env.CI_IMAGE }}
        load: true
        cache-from: type=gha,scope=tests
        cache-to: type=gha,mode=max,scope=tests

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/composer/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install PHP dependencies
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e COMPOSER_CACHE_DIR=/tmp/composer-cache \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -v "$HOME/.cache/composer/files:/tmp/composer-cache" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Run full Pest suite
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
        XDEBUG_MODE: off
      run: |
        docker run --rm --user "$(id -u):$(id -g)" \
          -e DB_CONNECTION -e DB_DATABASE -e XDEBUG_MODE \
          -e PHP_OPCACHE_ENABLE -e PHP_MEMORY_LIMIT -e PHP_MAX_EXECUTION_TIME \
          -v "${{ github.workspace }}:/var/www/html" \
          -w /var/www/html "${{ env.CI_IMAGE }}" \
          composer test -- --parallel

    - name: Summarize job duration
      if: always()
      run: |
        duration="$(( $(date +%s) - JOB_STARTED_AT ))"
        {
          echo "## Tests"
          echo
          echo "Completed in ${duration}s without Xdebug coverage instrumentation."
        } >> "$GITHUB_STEP_SUMMARY"

  topology:
    name: Topology
    needs: changes
    if: needs.changes.outputs.topology == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Record job start
      run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install topology smoke dependencies
      run: bun install --frozen-lockfile

    - name: Run SvelteKit container topology smoke test
      run: .github/scripts/smoke-sveltekit-topology.sh

    - name: Summarize job duration
      if: always()
      run: |
        duration="$(( $(date +%s) - JOB_STARTED_AT ))"
        {
          echo "## Topology duration"
          echo
          echo "Completed in ${duration}s. Scope: ${{ needs.changes.outputs.reason }}."
        } >> "$GITHUB_STEP_SUMMARY"

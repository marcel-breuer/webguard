worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
        'request_id=$request_id upstream=$upstream_addr upstream_status=$upstream_status';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    map $request_method $public_status_cache_control {
        default '';
        GET 'public, max-age=30, stale-while-revalidate=60';
        HEAD 'public, max-age=30, stale-while-revalidate=60';
    }

    upstream laravel {
        server php:8080;
    }

    upstream sveltekit {
        server frontend:3000;
    }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 100m;

        location = /_health/gateway {
            access_log off;
            add_header Cache-Control 'no-store' always;
            return 204;
        }

        location = /_health/frontend {
            proxy_pass http://sveltekit/_health/frontend;
            include /etc/nginx/proxy-headers.conf;
        }

        location = /_health/laravel {
            proxy_pass http://laravel/status;
            include /etc/nginx/proxy-headers.conf;
        }

        location = /status {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }

        location ~* "^/status/[0-9a-hjkmnp-tv-z]{26}/subscribers/unsubscribe/[^/]+/?$" {
            error_page 418 = @laravel;

            if ($request_method !~ "^GET$|^HEAD$|^POST$") {
                return 418;
            }

            proxy_pass http://sveltekit;
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~* "^/status/[0-9a-hjkmnp-tv-z]{26}/subscribers/confirm/[^/]+/?$" {
            error_page 418 = @laravel;

            if ($request_method !~ "^GET$") {
                return 405;
            }

            proxy_pass http://sveltekit;
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location ~ ^/status/[^/]+/subscribers(?:/|$) {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }

        location ~ ^/status/[^/]+/?$ {
            error_page 418 = @laravel;

            if ($request_method !~ "^GET$|^HEAD$|^POST$") {
                return 418;
            }

            add_header Cache-Control $public_status_cache_control always;
            proxy_pass http://sveltekit;
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /badge.js {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }

        location = /api {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }

        location ^~ /api/ {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }

        location ^~ /sanctum/ {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }

        location / {
            error_page 418 = @laravel;
            error_page 404 = @laravel;

            if ($request_method !~ "^GET$|^HEAD$") {
                return 418;
            }

            proxy_intercept_errors on;
            proxy_pass http://sveltekit;
            include /etc/nginx/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location @laravel {
            proxy_pass http://laravel;
            include /etc/nginx/proxy-headers.conf;
        }
    }
}

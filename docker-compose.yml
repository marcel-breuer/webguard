x-app-environment: &app-environment
  APP_NAME: "WebGuard"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?APP_KEY must be set to a persistent Laravel application key}"
  APP_URL: "${APP_URL:?APP_URL must be set to the canonical application URL}"
  MARKETING_URL: "${MARKETING_URL:?MARKETING_URL must be set for canonical legal links}"
  APP_TIMEZONE: "Europe/Berlin"
  APP_LOCALE: "en"
  APP_FALLBACK_LOCALE: "en"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  MAIL_MAILER: "${MAIL_MAILER:-smtp}"
  MAIL_HOST: "${MAIL_HOST:-smtp.example.com}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
  MAIL_USERNAME: "${SMTP_USERNAME:-null}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-null}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.com}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-WebGuard}"
  DB_CONNECTION: "mysql"
  DB_HOST: "${DB_HOST:-mysql}"
  DB_PORT: "${DB_PORT:-3306}"
  DB_DATABASE: "${DB_DATABASE:-webguard_core}"
  DB_USERNAME: "${DB_USERNAME:-webguard}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set for production deployments}"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "${REDIS_HOST:-redis}"
  REDIS_USERNAME: "${REDIS_USERNAME:-null}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production deployments}"
  REDIS_PORT: "${REDIS_PORT:-6379}"
  REDIS_QUEUE_CONNECTION: "default"
  REDIS_QUEUE: "default"
  HEARTBEAT_QUEUE: "heartbeat"
  MONITORING_REGIONAL_CONSENSUS_FRESHNESS_MINUTES: "${MONITORING_REGIONAL_CONSENSUS_FRESHNESS_MINUTES:-10}"
  FCM_PROJECT_ID: "${FCM_PROJECT_ID:-}"
  FCM_ACCESS_TOKEN: "${FCM_ACCESS_TOKEN:-}"
  FCM_SERVICE_ACCOUNT_JSON: "${FCM_SERVICE_ACCOUNT_JSON:-}"
  FCM_SERVICE_ACCOUNT_PATH: "${FCM_SERVICE_ACCOUNT_PATH:-}"
  APNS_KEY_ID: "${APNS_KEY_ID:-}"
  APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
  APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-}"
  APNS_PRIVATE_KEY: "${APNS_PRIVATE_KEY:-}"
  APNS_PRIVATE_KEY_PATH: "${APNS_PRIVATE_KEY_PATH:-}"
  APNS_ENVIRONMENT: "${APNS_ENVIRONMENT:-production}"

services:
  php:
    container_name: webguard-php
    build:
      context: .
      target: production
    image: webguard-core-php:latest
    restart: unless-stopped
    stop_signal: SIGTERM
    environment:
      <<: *app-environment
      SSL_MODE: "${DOCKER_SSL_MODE:-off}"
      PHP_MEMORY_LIMIT: "2048M"
      PHP_UPLOAD_MAX_FILE_SIZE: "100M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATE: "true"
      AUTORUN_LARAVEL_MIGRATION_FORCE: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      AUTORUN_LARAVEL_SCRIBE_GENERATE: "${AUTORUN_LARAVEL_SCRIBE_GENERATE:-false}"
    healthcheck:
      test: ["CMD", "webguard-healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    volumes:
      - config:/config
      - data:/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      webguard-network:
        aliases:
          - webguard-core
          - webguard-api

  frontend:
    container_name: webguard-frontend
    build:
      context: .
      target: sveltekit_production
    image: webguard-frontend:latest
    restart: unless-stopped
    stop_signal: SIGTERM
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      ORIGIN: "${APP_URL:?APP_URL must be set to the canonical application URL}"
      BODY_SIZE_LIMIT: "100M"
    depends_on:
      php:
        condition: service_healthy
    networks:
      - webguard-network

  gateway:
    container_name: webguard-gateway
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    image: webguard-gateway:latest
    restart: unless-stopped
    stop_signal: SIGQUIT
    expose:
      - "8080"
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - webguard-network

  schedule:
    container_name: webguard-schedule
    build:
      context: .
      target: worker
    image: webguard-core-worker:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      PHP_MEMORY_LIMIT: "2048M"
      PHP_UPLOAD_MAX_FILE_SIZE: "100M"
      PHP_MAX_EXECUTION_TIME: "3600"
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "false"
    command:
      - sh
      - -lc
      - |
        trap "exit 0" TERM INT QUIT
        while true; do
          php artisan schedule:run --verbose --no-interaction
          sleep 60 & wait %1
        done
    stop_signal: SIGTERM
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - webguard-network

  queue-default:
    container_name: webguard-queue-default
    build:
      context: .
      target: worker
    image: webguard-core-worker:latest
    restart: unless-stopped
    environment:
      <<: *app-environment
      PHP_MEMORY_LIMIT: "2048M"
      PHP_UPLOAD_MAX_FILE_SIZE: "100M"
      PHP_MAX_EXECUTION_TIME: "3600"
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "false"
    command: php artisan queue:work redis --queue=default,heartbeat --sleep=1 --tries=1 --max-time=3600
    stop_signal: SIGTERM
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s
    networks:
      - webguard-network

  mysql:
    container_name: webguard-mysql
    profiles:
      - internal-services
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set when using bundled MySQL}"
      MYSQL_DATABASE: "${DB_DATABASE:-webguard_core}"
      MYSQL_USER: "${DB_USERNAME:-webguard}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set for production deployments}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webguard-network

  redis:
    container_name: webguard-redis
    profiles:
      - internal-services
    image: redis:8.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set for production deployments}"
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - webguard-network

volumes:
  config:
    driver: local
  data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  webguard-network:
    name: "${WEBGUARD_NETWORK:-webguard-network}"
    external: true
